# Builds the Microsoft Store package (.msix) and keeps it as a download on the run's page
# (Summary → Artifacts). For a `v*` tag, it also submits it to the Store.
#
# It isn't attached to the GitHub release: it's unsigned until the Store signs it, so it
# can't be installed from there anyway. The build itself is in packaging/msix/build-msix.ps1.
name: Store package

on:
  push:
    tags: ["v*"]
    # And on any branch where the packaging itself changed, to check it still works.
    branches: ["**"]
    paths:
      - "packaging/**"
      - "examples/store_logos.rs"
      - ".github/workflows/store.yml"
  # A "Run workflow" button on the Actions page, to build one without a release.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msix:
    name: Build the .msix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Never package something that fails the tests.
      - run: cargo test --locked

      - run: ./packaging/msix/build-msix.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: minesweeper-msix
          path: target/msix/*.msix
          if-no-files-found: error

  # Submits the package as an update: a new submission, copied from the last one (listing,
  # images, age rating), with this package and packaging/msix/whats-new.txt in it.
  # Microsoft then certifies and publishes it.
  publish:
    name: Submit to the Microsoft Store
    needs: msix
    # Only releases. Branch runs (packaging changes) must never publish.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # The Store secrets live in this environment, not in the whole repository: its rules
    # (Settings → Environments) let only `v*` tags use them.
    environment: microsoft-store
    env:
      STORE_PRODUCT_ID: 9P25P9L8R8Z3 # Classic Mine Sweeper (the Partner Center URL has it too)
    steps:
      # For the publish script, whats-new.txt and the version in Cargo.toml.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: minesweeper-msix
          path: msix

      # Installs Microsoft's Store CLI, `msstore`.
      - uses: microsoft/microsoft-store-apppublisher@v1.4

      # The secrets go in through environment variables, so they never appear in the
      # script itself (GitHub also hides them in the log).
      - name: Sign in to Partner Center
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET

      - name: Submit the package and "What's new"
        run: |
          $msix = Get-ChildItem msix -Filter *.msix | Select-Object -First 1
          ./packaging/msix/publish-store.ps1 -Msix $msix.FullName -ProductId $env:STORE_PRODUCT_ID
