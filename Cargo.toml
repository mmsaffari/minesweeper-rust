[package]
name = "minesweeper"
version = "1.4.0"
edition = "2024"
description = "The classic Minesweeper, rebuilt in Rust with macroquad"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mmsaffari/minesweeper-rust"

[dependencies]
directories = "6.0.0"
macroquad = "0.4.16"
open = { version = "5.4.4", optional = true }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", optional = true }

# `cargo build --release`: slower to compile, but a smaller and faster executable.
[profile.release]
lto = true          # optimise across all crates together, not one crate at a time
codegen-units = 1   # one compilation unit: slower build, better optimisation
strip = true        # leave debug symbols out of the executable

[build-dependencies]
winresource = "0.1.34"

# Only for tools in examples/, never part of the game.
[dev-dependencies]
fontdue = "0.9.4" # examples/store_art.rs writes text (macroquad already uses it)
png = "0.18.1"   # examples/store_logos.rs and store_art.rs write PNG files

[features]
# Look for a newer release on GitHub once at startup. The GitHub release build turns it on;
# the Microsoft Store build leaves it off, because the Store updates apps itself.
update-check = ["dep:ureq", "dep:open"]
